<style>
.enois-pdf-cover{--ep-bg:#05080c;--ep-cyan:#6dd3e8;--ep-mint:#70e0b5;--ep-gold:#e1b85b;--ep-orange:#ff8a3d;--ep-white:#f5f8fb;box-sizing:border-box;position:relative;isolation:isolate;container-type:inline-size;width:100%;aspect-ratio:4/1;min-height:clamp(250px,calc(600px - 50vw),320px);overflow:hidden;border:1px solid #e1b85b55;background:var(--ep-bg);color:var(--ep-white);font-family:Arial,Helvetica,sans-serif;text-align:left;color-scheme:dark}
.enois-pdf-cover *,.enois-pdf-cover *::before,.enois-pdf-cover *::after{box-sizing:border-box}

.enois-pdf-cover::after{content:"";position:absolute;left:0;top:36%;width:4px;height:28%;background:var(--ep-orange)}
.enois-pdf-cover .ep-copy{position:absolute;left:4%;right:29%;top:50%;transform:translateY(-50%)}
.enois-pdf-cover .ep-name{margin:0 0 18px;font-size:clamp(22px,3.4cqi,46px);font-weight:700;line-height:1.12;letter-spacing:-.045em;color:var(--ep-white)}
.enois-pdf-cover .ep-signature{color:var(--ep-cyan);white-space:nowrap}
.enois-pdf-cover .ep-description{margin:0;max-width:650px;font-size:clamp(12px,1.36cqi,17px);font-weight:400;line-height:1.7;letter-spacing:.01em;color:var(--ep-white);text-wrap:pretty}
.enois-pdf-cover .ep-primary{color:var(--ep-mint)}
.enois-pdf-cover .ep-secondary{color:var(--ep-gold)}
.enois-pdf-cover .ep-radio{position:absolute;top:16px;right:20px;width:250px;display:flex;align-items:center;gap:10px}
.enois-pdf-cover .ep-radio-label{font-size:10px;line-height:1.3;letter-spacing:.12em;font-weight:700;color:var(--ep-cyan)}
.enois-pdf-cover .ep-audio{display:block;width:200px;min-width:0;height:32px;border-radius:18px}
.enois-pdf-cover .ep-audio:focus-visible{outline:2px solid var(--ep-orange);outline-offset:5px}
.enois-pdf-cover .ep-pose{position:absolute;right:5%;bottom:6%;width:18%;height:68%;overflow:visible}
@container (max-width:700px){.enois-pdf-cover .ep-copy{left:6%;right:25%;top:58%}.enois-pdf-cover .ep-name{font-size:clamp(23px,4.6cqi,32px);margin-bottom:13px}.enois-pdf-cover .ep-description{font-size:12px;line-height:1.6}.enois-pdf-cover .ep-radio{top:16px;right:16px}.enois-pdf-cover .ep-pose{right:3%;bottom:8%;width:19%;height:58%}}
@media(max-width:700px){.enois-pdf-cover{aspect-ratio:auto;min-height:320px}}
@container (max-width:400px){.enois-pdf-cover .ep-copy{right:24%;top:60%}.enois-pdf-cover .ep-name{font-size:24px}.enois-pdf-cover .ep-description{font-size:12px;line-height:1.55}.enois-pdf-cover .ep-pose{width:19%;right:2%;bottom:6%;height:55%}}
</style>
